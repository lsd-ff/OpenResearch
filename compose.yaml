x-model-environment: &model-environment
  OPENRESEARCH_LLM_PROVIDER: ${OPENRESEARCH_LLM_PROVIDER:-openai}
  OPENRESEARCH_LLM_BASE_URL: ${OPENRESEARCH_LLM_BASE_URL:-https://api.openai.com/v1}
  OPENRESEARCH_LLM_MODEL: ${OPENRESEARCH_LLM_MODEL:-}
  OPENRESEARCH_LLM_API_KEY: ${OPENRESEARCH_LLM_API_KEY:-}
  OPENRESEARCH_LLM_TIMEOUT_SECONDS: ${OPENRESEARCH_LLM_TIMEOUT_SECONDS:-60}
  OPENRESEARCH_LLM_MAX_OUTPUT_TOKENS: ${OPENRESEARCH_LLM_MAX_OUTPUT_TOKENS:-8192}
  OPENRESEARCH_LLM_SCHEMA_RETRIES: ${OPENRESEARCH_LLM_SCHEMA_RETRIES:-1}
  OPENRESEARCH_LLM_THINKING: ${OPENRESEARCH_LLM_THINKING:-default}
  OPENRESEARCH_LLM_STRUCTURED_OUTPUT: ${OPENRESEARCH_LLM_STRUCTURED_OUTPUT:-prompt}

services:
  api:
    build:
      context: .
      args:
        OPENRESEARCH_PIP_INDEX_URL: ${OPENRESEARCH_PIP_INDEX_URL:-https://pypi.org/simple}
    image: openresearch-python:local
    ports:
      - "127.0.0.1:${OPENRESEARCH_PORT:-8080}:8080"
    environment: &runtime
      <<: *model-environment
      OPENRESEARCH_DATA_DIR: /data
      OPENRESEARCH_API_TOKEN: ${OPENRESEARCH_API_TOKEN:-}
      OPENRESEARCH_TASK_TIMEOUT_SECONDS: ${OPENRESEARCH_TASK_TIMEOUT_SECONDS:-600}
      OPENRESEARCH_PLAN_TIMEOUT_SECONDS: ${OPENRESEARCH_PLAN_TIMEOUT_SECONDS:-2400}
      OPENRESEARCH_MAX_TASK_ATTEMPTS: ${OPENRESEARCH_MAX_TASK_ATTEMPTS:-100}
      OPENRESEARCH_CODE_MAX_REPAIRS: ${OPENRESEARCH_CODE_MAX_REPAIRS:-2}
      OPENRESEARCH_RUNTIME_PROFILES: ${OPENRESEARCH_RUNTIME_PROFILES:-null}
      OPENRESEARCH_REPRODUCTION_FULL_MIN_CPU: ${OPENRESEARCH_REPRODUCTION_FULL_MIN_CPU:-16}
      OPENRESEARCH_REPRODUCTION_FULL_MIN_MEMORY_MB: ${OPENRESEARCH_REPRODUCTION_FULL_MIN_MEMORY_MB:-65536}
      OPENRESEARCH_REPRODUCTION_FULL_MIN_DISK_MB: ${OPENRESEARCH_REPRODUCTION_FULL_MIN_DISK_MB:-102400}
      OPENRESEARCH_REPRODUCTION_FULL_MIN_GPU: ${OPENRESEARCH_REPRODUCTION_FULL_MIN_GPU:-1}
      OPENRESEARCH_PLANNER_MODE: ${OPENRESEARCH_PLANNER_MODE:-llm}
      OPENRESEARCH_SOURCE_PROXY_URL: ${OPENRESEARCH_SOURCE_PROXY_URL:-}
      OPENRESEARCH_DEPENDENCY_MAX_BYTES: ${OPENRESEARCH_DEPENDENCY_MAX_BYTES:-134217728}
      OPENRESEARCH_SOURCE_DOWNLOAD_TIMEOUT_SECONDS: ${OPENRESEARCH_SOURCE_DOWNLOAD_TIMEOUT_SECONDS:-60}
      OPENRESEARCH_SANDBOX_MEMORY: ${OPENRESEARCH_SANDBOX_MEMORY:-1g}
      OPENRESEARCH_SANDBOX_TMPFS_SIZE_MB: ${OPENRESEARCH_SANDBOX_TMPFS_SIZE_MB:-256}
      OPENRESEARCH_SANDBOX_WORKSPACE_SIZE_MB: ${OPENRESEARCH_SANDBOX_WORKSPACE_SIZE_MB:-1024}
      OPENRESEARCH_SANDBOX_BACKEND: http
      OPENRESEARCH_SANDBOX_URL: http://sandbox:8082
      OPENRESEARCH_SANDBOX_TOKEN: ${OPENRESEARCH_SANDBOX_TOKEN:-}
      OPENRESEARCH_INTENT_SERVICE_URL: ${OPENRESEARCH_INTENT_SERVICE_URL:-}
      OPENRESEARCH_INTENT_SERVICE_TOKEN: ${OPENRESEARCH_INTENT_SERVICE_TOKEN:-}
    volumes:
      - research-data:/data
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    image: openresearch-python:local
    command: ["/app/.venv/bin/openresearch", "worker"]
    environment: *runtime
    volumes:
      - research-data:/data
    depends_on:
      api:
        condition: service_healthy
  intent:
    profiles: ["ai"]
    image: openresearch-python:local
    command: ["/app/.venv/bin/openresearch", "intent"]
    environment:
      <<: *model-environment
      OPENRESEARCH_SANDBOX_MEMORY: ${OPENRESEARCH_SANDBOX_MEMORY:-1g}
      OPENRESEARCH_DEPENDENCY_MAX_BYTES: ${OPENRESEARCH_DEPENDENCY_MAX_BYTES:-134217728}
      OPENRESEARCH_INTENT_SERVICE_TOKEN: ${OPENRESEARCH_INTENT_SERVICE_TOKEN:-}
      OPENRESEARCH_INTENT_SERVICE_PORT: 8083
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  sandbox:
    image: openresearch-python:local
    command: ["/app/.venv/bin/openresearch", "sandbox"]
    environment:
      OPENRESEARCH_DATA_DIR: /data
      OPENRESEARCH_SANDBOX_TOKEN: ${OPENRESEARCH_SANDBOX_TOKEN:-}
      OPENRESEARCH_SANDBOX_SERVICE_PORT: 8082
      OPENRESEARCH_GPU_WAIT_SECONDS: ${OPENRESEARCH_GPU_WAIT_SECONDS:-30}
      OPENRESEARCH_TASK_TIMEOUT_SECONDS: ${OPENRESEARCH_TASK_TIMEOUT_SECONDS:-600}
      OPENRESEARCH_SANDBOX_IMAGE: ${OPENRESEARCH_SANDBOX_IMAGE:-python:3.12-slim}
      OPENRESEARCH_RUNTIME_PROFILES: ${OPENRESEARCH_RUNTIME_PROFILES:-null}
      OPENRESEARCH_DEPENDENCY_MAX_BYTES: ${OPENRESEARCH_DEPENDENCY_MAX_BYTES:-134217728}
      OPENRESEARCH_SANDBOX_MEMORY: ${OPENRESEARCH_SANDBOX_MEMORY:-1g}
      OPENRESEARCH_SANDBOX_TMPFS_SIZE_MB: ${OPENRESEARCH_SANDBOX_TMPFS_SIZE_MB:-256}
      OPENRESEARCH_SANDBOX_WORKSPACE_SIZE_MB: ${OPENRESEARCH_SANDBOX_WORKSPACE_SIZE_MB:-1024}
      OPENRESEARCH_SANDBOX_FALLBACK_ENABLED: ${OPENRESEARCH_SANDBOX_FALLBACK_ENABLED:-false}
      OPENRESEARCH_OPENSANDBOX_URL: ${OPENRESEARCH_OPENSANDBOX_URL:-http://host.docker.internal:8088}
      OPENRESEARCH_OPENSANDBOX_API_KEY: ${OPENRESEARCH_OPENSANDBOX_API_KEY:-}
    volumes:
      - sandbox-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  research-data:
  sandbox-data:
