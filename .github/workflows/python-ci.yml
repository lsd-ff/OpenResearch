name: Python Runtime

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked python scripts/check.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked pytest -m docker
        env:
          OPENRESEARCH_TEST_DOCKER: '1'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group release
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: uv run --locked --group release python scripts/build_release.py
      - name: Audit frozen resources and private-file boundaries
        shell: bash
        run: |
          artifact=dist/release/openresearch
          if [ "$RUNNER_OS" = Windows ]; then artifact="$artifact.exe"; fi
          uv run --locked --group release python scripts/audit_release.py "$artifact"
      - name: Frozen CLI startup on Windows
        if: runner.os == 'Windows'
        run: ./dist/release/openresearch.exe --help
      - name: Isolated executable, real Docker, dependencies, PDF and restart
        if: runner.os == 'Linux'
        run: uv run --locked --group release python scripts/verify_release.py dist/release/openresearch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/release/
            .data/release-acceptance/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    env:
      OPENRESEARCH_HOST: '127.0.0.1'
      OPENRESEARCH_PORT: '38080'
      OPENRESEARCH_DATA_DIR: ${{ github.workspace }}/.data/ui-e2e
      OPENRESEARCH_LLM_PROVIDER: openai
      OPENRESEARCH_LLM_BASE_URL: http://127.0.0.1:38081/v1
      OPENRESEARCH_LLM_MODEL: ui-intent-fixture
      OPENRESEARCH_LLM_API_KEY: ui-test-only
      OPENRESEARCH_LLM_STRUCTURED_OUTPUT: prompt
      OPENRESEARCH_API_TOKEN: ''
      OPENRESEARCH_SANDBOX_BACKEND: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser, API and real Docker Worker acceptance
        shell: bash
        run: |
          uv run --locked uvicorn --app-dir tests/e2e model_server:app --host 127.0.0.1 --port 38081 > "$RUNNER_TEMP/ui-model.log" 2>&1 &
          classifier_pid=$!
          uv run --locked openresearch worker > "$RUNNER_TEMP/ui-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$classifier_pid" "$worker_pid" 2>/dev/null || true' EXIT
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/ui-*.log
          retention-days: 7
